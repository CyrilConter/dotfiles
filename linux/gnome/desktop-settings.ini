# GNOME desktop settings — loaded by linux/setup/08-gnome.sh with:
#   dconf load /org/gnome/ < linux/gnome/desktop-settings.ini
# Only keys set here are changed; anything else keeps its default.
# Hardware-neutral on purpose: works the same on desktop and laptop.

[desktop/interface]
accent-color='red'
color-scheme='prefer-dark'
gtk-theme='Yaru-red-dark'
icon-theme='Yaru-red-dark'

[desktop/input-sources]
sources=[('xkb', 'fr')]

[desktop/peripherals/keyboard]
numlock-state=true

[desktop/peripherals/touchpad]
two-finger-scrolling-enabled=true

# Wallpaper ships with the ubuntu-wallpapers package (default on Ubuntu desktop).
[desktop/background]
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/iryge-Anomaly.png'
picture-uri-dark='file:///usr/share/backgrounds/iryge-Anomaly.png'
primary-color='#000000000000'
secondary-color='#000000000000'

[desktop/screensaver]
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/iryge-Anomaly.png'
primary-color='#000000000000'
secondary-color='#000000000000'

[desktop/privacy]
report-technical-problems=false

# Never auto-suspend on AC power (battery behavior keeps the default).
[settings-daemon/plugins/power]
sleep-inactive-ac-timeout=3600
sleep-inactive-ac-type='nothing'

[nautilus/preferences]
default-folder-viewer='list-view'
