# GNOME Shell extension settings — loaded by linux/setup/08-gnome.sh with:
#   dconf load /org/gnome/shell/ < linux/gnome/extensions.ini
#
# Machine-specific values are deliberately left out so this works on any
# hardware: the dock's monitor connector, and Astra Monitor's GPU PCI IDs /
# disk ID / profiles (it auto-detects the GPU and disk on first start).
# Blur my Shell runs on its defaults, so it has no section here.

[/]
enabled-extensions=['ding@rastersoft.com', 'ubuntu-dock@ubuntu.com', 'tiling-assistant@ubuntu.com', 'snapd-search-provider@canonical.com', 'web-search-provider@ubuntu.com', 'blur-my-shell@aunetx', 'monitor@astraext.github.io', 'dash-to-dock@micxgx.gmail.com']

[extensions/dash-to-dock]
apply-custom-theme=false
background-opacity=0.80000000000000004
custom-theme-shrink=true
dash-max-icon-size=32
dock-fixed=true
dock-position='BOTTOM'
extend-height=false
height-fraction=0.90000000000000002
show-mounts-network=false
show-mounts-only-mounted=true

[extensions/astra-monitor]
gpu-header-show=true
gpu-indicators-order='["icon","activity bar","activity graph","activity percentage","memory bar","memory graph","memory percentage","memory value"]'
headers-height=0
headers-height-override=0
memory-indicators-order='["icon","bar","graph","percentage","value","free"]'
monitors-order='["processor","gpu","memory","storage","network","sensors"]'
network-indicators-order='["icon","IO bar","IO graph","IO speed"]'
processor-indicators-order='["icon","bar","graph","percentage","frequency"]'
sensors-header-show=true
sensors-indicators-order='["icon","value"]'
storage-header-show=false
storage-indicators-order='["icon","bar","percentage","value","free","IO bar","IO graph","IO speed"]'
theme-style='dark'

[extensions/tiling-assistant]
focus-hint-color='rgb(203,67,20)'
import-layout-examples=false
tiling-popup-all-workspace=true

[extensions/ding]
icon-size='small'
start-corner='top-right'
